<style>
:root {
  color-scheme: light dark;
  --bg: #eff2f5; --surface: #fff; --surface-2: #e7ecf0; --ink: #12202b; --muted: #566775; --line: #d5dce2;

}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1920; --surface: #15232c; --surface-2: #1c2d38; --ink: #e5ecf1; --muted: #93a5b2; --line: #284050; --band: #0b3556;
          --mo: #8fb4d6; --mat: #d6a15a; --eq: #5cc08f; --ot: #8a9ba7; --up: #f08a80; --down: #5cc08f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); padding-inline: 16px; }
.wrap { max-width: 1060px; margin-inline: auto; padding-block: 16px 64px; }
.top { position: sticky; top: 0; z-index: 5; background: #05233D; border-bottom: 0; margin-inline: -16px; padding: 10px 16px; }
.top-in { max-width: 1060px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font: 600 14px var(--display); letter-spacing: .14em; text-transform: uppercase; color: #F6F5F1; text-decoration: none; } .brand img { height: 36px; width: auto; display: block; }
.brand span { color: #9AA3AC; font-weight: 500; }
.nav { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 14px; }
.nav a { color: #F6F5F1; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: #fff; border-color: #9E6D29; }
.mods { display: flex; gap: 8px; margin: 18px 0 4px; flex-wrap: wrap; }
.mod { font: 600 15px var(--display); letter-spacing: .08em; padding: 9px 14px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: transparent; cursor: pointer; }
.mod[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--mo); outline-offset: 2px; }

/* bandas de sección, como en la revista */
.band { background: var(--band); color: var(--band-ink); display: flex; align-items: center; gap: 16px; padding: 10px 18px; margin-top: 40px; scroll-margin-top: 64px; }
.band .nn { font: 700 64px/0.9 var(--display); }
.band h2 { margin: 0; font: 700 30px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.panel { background: var(--surface); border: 1px solid var(--line); border-top: 0; padding: 18px 20px; }
.metodo { color: var(--muted); font-size: 14px; max-width: 105ch; }
.refs { display: flex; gap: 6px 28px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.refs b { color: var(--ink); }

/* variación */
.vgrid { display: grid; grid-template-columns: 170px 1fr; gap: 18px 22px; align-items: center; }
.vk { font: 700 20px/1.05 var(--display); text-transform: uppercase; text-align: right; letter-spacing: .02em; }
.vv { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.big { font: 700 44px/1 var(--display); white-space: nowrap; }
.big small { font-size: 24px; }
.big.up { color: var(--up); } .big.down { color: var(--down); }
.vt { color: var(--muted); font-size: 14px; max-width: 70ch; }
.est { font-size: 12.5px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }

/* ficha del modelo */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px 30px; align-items: start; }
.hero h3 { margin: 0 0 6px; font: 700 26px var(--display); text-transform: uppercase; }
.price { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline; margin: 14px 0 6px; }
.price .pm { font: 700 clamp(40px, 7vw, 62px)/1 var(--display); }
.price .pm::before { content: "PRECIO FINAL "; font: 600 16px var(--body); color: var(--muted); letter-spacing: .06em; }
.price .pv { font: 700 30px var(--display); }
.sup { font: 600 15px var(--body); color: var(--muted); }
.sup b { font: 700 34px var(--display); color: var(--ink); }
.plano { margin: 0; background: #fff; border: 1px solid var(--line); padding: 8px; }
.plano img { display: block; width: 100%; height: auto; max-height: 640px; object-fit: contain; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
.rt th { font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; text-align: right; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.rt th:nth-child(-n+2), .rt td:nth-child(-n+2) { text-align: left; }
.rt td { padding: 6px 10px; border-top: 1px solid var(--line); text-align: right; font: 13px var(--num); white-space: nowrap; }
.rt td:nth-child(2) { font-family: var(--body); font-size: 14px; white-space: normal; }
.rt td:first-child { color: var(--muted); width: 32px; }
.rt tr.sum td { font-weight: 700; background: var(--surface-2); }
.rt tr.fin td { font-weight: 600; }
.rt tr.pf td { font-weight: 700; background: color-mix(in srgb, var(--mat) 16%, var(--surface)); font-size: 14px; }
.rt tr.inc td { color: var(--muted); font-size: 12px; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.mix { display: flex; height: 12px; background: var(--surface-2); min-width: 90px; }
.mix i { display: block; height: 100%; } .mix .a { background: var(--mo); } .mix .b { background: var(--mat); } .mix .e { background: var(--eq); } .mix .o { background: var(--ot); }
.legend { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }

.ctl { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; font-size: 14px; }
.ctl label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.ctl select { font: 500 14px var(--body); padding: 6px 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.graf { position: relative; margin: 6px 0 22px; }
.graf h3 { margin: 0 0 4px; font: 700 20px var(--display); text-transform: uppercase; letter-spacing: .03em; }
.graf svg { width: 100%; height: auto; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; line-height: 1.5; z-index: 3; white-space: nowrap; }
.tip .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; }
/* unitarios */
.btn { font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--mo); }
details.ru { border-bottom: 1px solid var(--line); }
details.ru summary { padding: 10px 6px; cursor: pointer; font: 600 17px var(--display); text-transform: uppercase; letter-spacing: .03em; list-style: none; display: flex; gap: 10px; align-items: center; }
details.ru summary::-webkit-details-marker { display: none; }
details.ru summary::before { content: "▸"; color: var(--muted); font-size: 13px; transition: transform .15s; }
details.ru[open] summary::before { transform: rotate(90deg); }
details.ru summary span.n { color: var(--muted); font-weight: 500; }
.ut th { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; text-align: right; }
.ut th:first-child, .ut td:first-child { text-align: left; }
.ut td { padding: 6px 10px; border-top: 1px solid var(--line); text-align: right; font: 13px var(--num); white-space: nowrap; }
.ut td:first-child { font-family: var(--body); font-size: 14px; white-space: normal; }
.ut td.u { text-align: center; color: var(--muted); font-family: var(--body); }
/* materiales */
.tr { display: grid; grid-template-columns: 28px minmax(0, 1.4fr) minmax(0, 1.4fr) 120px 60px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tr .r { font: 600 18px var(--display); color: var(--muted); } .tr small { display: block; color: var(--muted); font-size: 12px; }

.tr .im { text-align: right; font: 13px var(--num); } .tr .pc { text-align: right; font: 13px var(--num); color: var(--muted); }

.metodo-g h4 { margin: 0 0 4px; font: 700 18px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.metodo-g p, .metodo-g li { color: var(--muted); font-size: 14px; margin: 4px 0; }
.metodo-g ul { padding-left: 18px; margin: 4px 0; }
.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 8px 24px; flex-wrap: wrap; justify-content: space-between; }
@media (max-width: 820px) {

  .band .nn { font-size: 44px; } .band h2 { font-size: 22px; }
  .tr { grid-template-columns: 24px minmax(0, 1fr) 100px; } .tr .bar, .tr .pc { display: none; }
}

const nf0 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v) => "$ " + nf0.format(Math.round(v));
const dash = (v) => (v ? nf0.format(Math.round(v)) : "—");
const pct = (v) => nf2.format(v * 100) + " %";
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const mesTxt = (m) => MESES[parseInt(m.slice(5), 10) - 1] + " " + m.slice(0, 4);
const fechaTxt = (iso) => iso.split("-").reverse().join("/");
const sgn = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + nf2.format(Math.abs(v) * 100);
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");

let mod = DATA.inicial || "2";
const V = DATA.V;

function pintarTabs() {
  $("mods").innerHTML = (DATA.orden || ["2", "1"]).map((k) => `<button class="mod" role="tab" data-m="${k}" aria-selected="${k === mod}">${esc(DATA.mods[k].corto)}</button>`).join("");
  document.querySelectorAll("#mods .mod").forEach((b) => b.addEventListener("click", () => { mod = b.dataset.m; pintar(); }));
}

function pVariacion(P) {
  const bloque = (k, v, txt) => `<div class="vk">${k}</div><div class="vv"><span class="big ${cls(v)}">${v == null ? "—" : sgn(v) + "<small> %</small>"}</span><span class="vt">${txt}</span></div>`;
  $("p-var").innerHTML = `
    <div class="refs"><span>DÓLAR: <b>US$ ${nf0.format(V.usd)}</b> <small>(oficial, ${fechaTxt(V.usd_fecha)})</small></span><span>CIERRE: <b>${fechaTxt(DATA.fecha)}</b></span><span>INFLACIÓN (IPC, ${mesTxt(V.ipc_mes)}): <b>${sgn(V.ipc)} %</b></span></div>
    <div class="vgrid">
      ${bloque("Costo general", P.v_general, `Promedio ponderado de la variación de la mano de obra y de los materiales de este modelo respecto del mes anterior, según su composición (${nf1.format(P.T.mo / P.T.directo * 100)} % mano de obra, ${nf1.format((P.T.directo - P.T.mo) / P.T.directo * 100)} % materiales).`)}
      ${bloque("Materiales", V.mat, `Variación del índice de materiales de la construcción (APYMECO), ${mesTxt(V.mat_mes)} respecto de ${mesTxt(V.mat_ant)}. Es el último mes publicado.`)}
      ${bloque("Mano de obra", V.mo, `Variación de la escala UOCRA (oficial), ${mesTxt(V.mo_mes)} respecto de ${mesTxt(V.mo_ant)}, aplicada con las cargas sociales vigentes.`)}
      ${bloque("Equipos", null, `Este modelo no incluye maquinaria propia: los equipos se contratan fuera de este precio.`)}
    </div>
    <p class="est">Variación <b>estimada</b> con los índices oficiales del último mes disponible de cada uno. Desde la segunda medición con nuestros propios precios de cada insumo se publica la variación medida.</p>`;
}

function pModelo(P) {
  const T = P.T, R = P.rubros;
  $("t-modelo").innerHTML = esc(P.titulo) + "<br>Costos estimados";
  const inc = (v) => pct(v / T.directo);
  const filas = R.map((r) => `<tr><td>${r.n}</td><td>${esc(r.nombre)}</td><td>${dash(r.mat)}</td><td>${dash(r.mo)}</td><td>${dash(r.eq)}</td><td>${dash(r.ot)}</td><td><b>${nf0.format(Math.round(r.imp))}</b></td><td>${inc(r.imp)}</td></tr>`).join("");
  const plano = DATA.plano && P.mod === 2 ? `<figure class="plano"><img src="data:image/png;base64,${DATA.plano}" alt="Planta de la vivienda: tres dormitorios en fila, dos baños, pasillo, estar, cocina-comedor, lavadero, porche y quincho"></figure>` : "";
  $("p-modelo").innerHTML = `
    <p class="metodo">Datos y cifras globales de referencia. Los valores corresponden a <b>costos directos</b>: materiales + ejecución (mano de obra + equipos), con rendimientos de análisis de precios, precios de materiales relevados en comercios de la zona (sin IVA) y jornales según escala UOCRA con cargas sociales. Se adicionan costos indirectos: gastos generales (${nf0.format(T.gg_p * 100)} %), beneficios (${nf0.format(T.ben_p * 100)} %) e IVA (${nf1.format(T.iva_p * 100)} %), que constituyen el precio final.</p>
    <div class="hero" ${plano ? "" : 'style="grid-template-columns:minmax(0,1fr)"'}>
      <div>
        <div class="price"><span class="pm">${money(T.total)}</span><span class="pv ${cls(P.v_general)}">VARIACIÓN ${sgn(P.v_general)} %</span></div>
        <p>${esc(P.descripcion)}</p>      </div>${plano}
    </div>
    <div class="legend"><span><i style="background:var(--mat)"></i>Materiales</span><span><i style="background:var(--mo)"></i>Mano de obra</span><span><i style="background:var(--eq)"></i>Equipos</span><span><i style="background:var(--ot)"></i>Otros (adicionales en %)</span></div>
    <div class="scroll"><table class="rt"><thead><tr><th>N°</th><th>Rubro</th><th>Materiales</th><th>Mano de obra</th><th>Equipos</th><th>Otros</th><th>Total</th><th>% inc.</th></tr></thead><tbody>${filas}
      <tr class="sum"><td></td><td>COSTO DIRECTO TOTAL $</td><td>${nf0.format(Math.round(T.mat))}</td><td>${nf0.format(Math.round(T.mo))}</td><td>${dash(T.eq)}</td><td>${dash(T.ot)}</td><td>${nf0.format(Math.round(T.directo))}</td><td>100,00 %</td></tr>
      <tr class="inc"><td></td><td>% incidencia</td><td>${inc(T.mat)}</td><td>${inc(T.mo)}</td><td>${inc(T.eq)}</td><td>${inc(T.ot)}</td><td>100,00 %</td><td></td></tr>
      <tr class="fin"><td></td><td>Gastos generales (${nf0.format(T.gg_p * 100)} %)</td><td colspan="5"></td><td>${nf0.format(Math.round(T.gg))}</td></tr>
      <tr class="fin"><td></td><td>Beneficios empresariales (${nf0.format(T.ben_p * 100)} %)</td><td colspan="5"></td><td>${nf0.format(Math.round(T.ben))}</td></tr>
      <tr class="fin"><td></td><td>Subtotal sin impuestos</td><td colspan="5"></td><td>${nf0.format(Math.round(T.sub))}</td></tr>
      <tr class="fin"><td></td><td>IVA (${nf1.format(T.iva_p * 100)} %)</td><td colspan="5"></td><td>${nf0.format(Math.round(T.iva))}</td></tr>
      <tr class="pf"><td></td><td>PRECIO FINAL TOTAL $</td><td colspan="5"></td><td>${nf0.format(Math.round(T.total))}</td></tr></tbody></table></div>
    ${P.complementarias ? `<p class="note">No incluye las obras complementarias de esta vivienda (red cloacal propia, biodigestor y muros perimetrales), que suman ${money(P.complementarias)} y se presupuestan aparte.</p>` : ""}`;
}

function pMat(P) {
  const max = P.top[0] ? P.top[0].imp : 1; let ac = 0;
  $("p-mat").innerHTML = `<p class="metodo">Cantidad total de cada material en toda la obra y su peso sobre el costo de materiales (${money(P.mat_total)}).</p>` + P.top.map((r, i) => { ac += r.pct;
    return `<div class="tr"><span class="r">${i + 1}</span><div>${esc(r.nombre)}<small>${nf1.format(r.q).replace(/,0$/, "")} ${esc(r.u)}</small></div><div class="bar"><i style="width:${r.imp / max * 100}%"></i></div><span class="im">${money(r.imp)}</span><span class="pc">${pct(r.pct)}</span></div>`; }).join("")
    + `<p class="note">Los 15 materiales juntos son el ${pct(ac)} del costo de materiales.</p>`;
}

function pMet() {
  $("p-met").innerHTML = `<div class="metodo-g">
    <div><h4>Rendimientos</h4><p>Salen del presupuesto original de la obra y de nuestra base de análisis de precios: horas de oficial y ayudante, y cantidades de cada material por unidad de tarea.</p></div>
    <div><h4>Mano de obra</h4><p>Escala UOCRA vigente multiplicada por 2,15, el coeficiente de cargas sociales que publica CAMARCO. Se actualiza con cada acuerdo paritario.</p></div>
    <div><h4>Materiales</h4><p>Precios de mercado vigentes en la zona (Resistencia, Chaco), sin IVA. Un precio con más de 90 días se reemplaza por uno actualizado.</p></div>
    <div><h4>Costos indirectos</h4><p>Gastos generales, beneficio e IVA sobre el costo directo, como se detalla en la ficha de cada modelo. El terreno, los honorarios de gestión municipal y los derechos de conexión no están incluidos.</p></div>
    <div><h4>Qué no incluye</h4><ul><li>Vidrios: van dentro de la carpintería.</li><li>Medidor de energía: lo coloca la distribuidora.</li><li>Obras complementarias, que se informan aparte.</li></ul></div>
    <div><h4>Actualización</h4><p>Los valores son referenciales y se recalculan con los precios del mes. Los precios de insumos se registran desde octubre de 2026; a partir de la segunda medición se publica la variación con nuestros propios precios.</p></div></div>`;
  $("foot-f").textContent = "Precios al " + fechaTxt(DATA.fecha) + " · Dólar oficial US$ " + nf0.format(V.usd);
}


/* ───── evolución: índice 100 = último mes, en pesos, pesos constantes (IPC) o dólares ───── */
let moneda = "pesos", periodo = "36";
function lineas(host, meses, series, fmt) {
  const W = 980, H = 300, L = 54, R = 66, Tp = 12, B = 28, n = meses.length;
  const vals = series.flatMap((s) => s.data.filter((v) => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = (i) => L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)), y = (v) => Tp + (hi - v) * (H - Tp - B) / (hi - lo);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--num)">${fmt(v)}</text>`; }
  const paso = Math.max(1, Math.ceil(n / 8));
  for (let i = 0; i < n; i += paso) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESES[parseInt(meses[i].slice(5), 10) - 1].slice(0, 3)}-${meses[i].slice(2, 4)}</text>`;
  series.forEach((s) => {
    let d = "", pen = false; s.data.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.5}" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    const li = s.data.length - 1; if (s.data[li] != null) g += `<text x="${x(li) + 5}" y="${y(s.data[li]) + 4}" font-size="11" fill="${s.color}" font-family="var(--num)">${fmt(s.data[li])}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}<line class="ch" y1="${Tp}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><rect class="hit" x="${L}" y="${Tp}" width="${W - L - R}" height="${H - Tp - B}" fill="transparent"/></svg><div class="tip" hidden></div>
    <div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), ch = host.querySelector(".ch");
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, i = Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - R) / (n - 1 || 1)))));
    ch.setAttribute("x1", x(i)); ch.setAttribute("x2", x(i)); ch.setAttribute("visibility", "visible"); tip.hidden = false;
    tip.innerHTML = `<b>${mesTxt(meses[i])}</b><br>` + series.map((s) => `<span class="sw" style="background:${s.color}"></span>${esc(s.name)}: ${s.data[i] == null ? "—" : fmt(s.data[i])}`).join("<br>");
    const hr = host.getBoundingClientRect(); tip.style.left = Math.min(e.clientX - hr.left + 14, hr.width - tip.offsetWidth - 4) + "px"; tip.style.top = (e.clientY - hr.top + 10) + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.hidden = true; ch.setAttribute("visibility", "hidden"); });
}

function pEvol(P) {
  // la página no calcula: la base entrega cada moneda ya hecha; acá sólo se elige y se recorta el período
  const E = P.evol, n = E.meses.length, ult = n - 1, M = E.m[moneda];
  const desde = periodo === "all" ? 0 : periodo === "ytd" ? Math.max(0, E.meses.map((m) => m.endsWith("-12")).lastIndexOf(true)) : Math.max(0, ult - Number(periodo));
  const meses = E.meses.slice(desde), cortar = (a) => a.slice(desde), fmt = (v) => nf1.format(v);
  const lbl = { pesos: "en pesos corrientes", ipc: "en pesos constantes de " + mesTxt(E.meses[ult]) + " (ajustado por IPC)", usd: "en dólares oficiales", blue: "en dólares blue" }[moneda];
  const fT = (v) => (moneda === "usd" || moneda === "blue" ? "US$ " + nf0.format(v) : "$ " + nf0.format(v));
  const t0 = M.total[desde], t1 = M.total[ult], vv = t0 && t1 ? t1 / t0 - 1 : null;
  $("p-evol").innerHTML = `<p class="metodo">Cómo evolucionó el costo de este modelo. Todos los índices valen <b>100 en ${mesTxt(E.meses[ult])}</b>, el último mes con datos: un valor de 120 significa que ese mes costaba 20 % más que hoy. Elegí en qué moneda verlo.</p>
    <div class="ctl">
      <label>Expresar en <select id="e-mon"><option value="pesos">Pesos corrientes</option><option value="ipc">Pesos constantes (ajuste por IPC)</option><option value="usd">Dólar oficial</option><option value="blue">Dólar blue</option></select></label>
      <label>Período <select id="e-per"><option value="12">Último año</option><option value="ytd">Año en curso</option><option value="36">3 años</option><option value="all">Todo</option></select></label>
    </div>
    <p class="note" style="margin:0 0 14px">Precio final total del modelo ${lbl}: <b>${t1 ? fT(t1) : "—"}</b> en ${mesTxt(E.meses[ult])}${t0 ? "; era " + fT(t0) + " en " + mesTxt(E.meses[desde]) : ""}${vv != null ? " (" + sgn(vv) + " %)" : ""}.</p>
    <div class="graf"><h3>Índice general del modelo</h3><div id="e-g1"></div></div>
    <div class="graf"><h3>Mano de obra y materiales</h3><div id="e-g2"></div></div>
    <p class="note">Mano de obra según la escala UOCRA con cargas sociales; materiales según el índice APYMECO. ${moneda === "ipc" ? "Inflación: IPC INDEC, último dato publicado " + mesTxt(E.ipc_mes) + "." : moneda === "pesos" ? "" : "Dólar: último valor de cada mes."} Estimación referencial.</p>`;
  $("e-mon").value = moneda; $("e-per").value = periodo;
  $("e-mon").onchange = (e) => { moneda = e.target.value; pEvol(P); }; $("e-per").onchange = (e) => { periodo = e.target.value; pEvol(P); };
  lineas($("e-g1"), meses, [{ name: "Costo del modelo", color: "var(--mo)", data: cortar(M.dir), w: 3 }].concat(moneda === "pesos" ? [{ name: "Inflación (IPC)", color: "var(--up)", data: cortar(E.m.ref.ipc), dash: true }, { name: "Dólar oficial", color: "var(--eq)", data: cortar(E.m.ref.usd), dash: true }] : []), fmt);
  lineas($("e-g2"), meses, [{ name: "Mano de obra", color: "var(--mo)", data: cortar(M.mo) }, { name: "Materiales", color: "var(--mat)", data: cortar(M.mat) }], fmt);
}

function pintar() { const P = DATA.mods[mod]; pintarTabs(); pVariacion(P); pModelo(P); pEvol(P); pMat(P); pMet(); }
pintar();
</script>
